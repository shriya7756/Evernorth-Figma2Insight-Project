services:
  - type: web
    name: evernorth-figma2insight-project
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: figma2insight
      - key: CORS_ORIGINS
        value: https://figma2insight.netlify.app,http://localhost:5174,http://127.0.0.1:5174
