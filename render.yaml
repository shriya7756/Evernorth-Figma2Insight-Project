services:
  - type: web
    name: evernorth-figma2insight-project
    runtime: python
    # Python version the integration was tested on (see DEPLOYMENT.md).
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" --timeout-keep-alive 75
    # Returns 200 only once the XGBoost model has loaded; Render restarts the service when it fails.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: figma2insight
      - key: CORS_ORIGINS
        value: https://figma2insight.netlify.app,http://localhost:5174,http://127.0.0.1:5174
      - key: FRONTEND_URL
        value: https://figma2insight.netlify.app
      # 512 MB instances: keep uploads at 25 MB or below (see DEPLOYMENT.md, "Memory").
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: WORKSPACE_TTL_HOURS
        value: "24"
      - key: LOG_LEVEL
        value: INFO
