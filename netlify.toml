[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Transparently proxy all /api requests from Netlify to the live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://evernorth-figma2insight-project.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
