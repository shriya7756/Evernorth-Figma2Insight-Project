[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"
# Lint the application server, backend package and tests. The research/training
# scripts under src/ and the repository root are kept as they were.
include = ["server.py", "backend/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]  # FastAPI's Depends()/Query() defaults are idiomatic
